# Информация о проекте
site_name: 'Документация GeoNetwork на русском языке'
site_description: 'Добро пожаловать в GeoNetwork. Эта документация организована в виде отдельных руководств, ориентированных на разные аудитории.'
site_dir: target/html
site_url: https://docs.geonetwork-opensource.org/

# Копирайт
copyright: Все права защищены &copy; 2001 - 2024 ФАО-ООН и другие

#docs_dir: docs/

extra_css:
  - assets/stylesheets/extra.css

# Configuration
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/geonetwork-logo.svg
  favicon: assets/images/geonetwork-logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - toc.follow
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.prune
    - navigation.indexes
    - navigation.footer
    - header.autohide
    - content.tabs.link
    - content.code.copy
    - content.action.view
    - content.action.edit
    - announce.dismiss

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

